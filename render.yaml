# Render Blueprint Specification
# Note: Render provides managed PostgreSQL natively. Spring Boot is configured with multi-engine Flyway/Hibernate,
# or you can connect an external MySQL database URL (like PlanetScale, Aiven, or Railway MySQL).
services:
  # 1. Python ML FastAPI Service
  - type: web
    name: smart-hospital-ml
    env: python
    rootDir: ml-service
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true

  # 2. Spring Boot Core Backend
  - type: web
    name: smart-hospital-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: smart-hospital-ml
          property: host

  # 3. React Frontend (Static Site)
  - type: web
    name: smart-hospital-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
