# Render Blueprint Specification
# Deploys: MySQL Database, Python ML Service, Spring Boot Backend, and React Frontend
services:
  # 1. Python ML FastAPI Service
  - type: web
    name: smart-hospital-ml
    env: python
    rootDir: ml-service
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true

  # 2. Spring Boot Core Backend
  - type: web
    name: smart-hospital-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_USERNAME
        fromDatabase:
          name: smart-hospital-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smart-hospital-db
          property: password
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: smart-hospital-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: smart-hospital-ml
          property: host

  # 3. React Vite Static Site
  - type: web
    name: smart-hospital-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed MySQL Database
  - name: smart-hospital-db
    databaseName: smart_hospital
    user: hospital_user
    plan: free
