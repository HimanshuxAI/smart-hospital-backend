# Demo profile for standalone cloud deployment (Render, PaaS)
# Uses embedded H2 with MySQL compatibility mode so Flyway & Hibernate work out of the box
app:
  seed:
    enabled: "${APP_SEED_ENABLED:true}"

spring:
  datasource:
    url: "jdbc:h2:mem:smarthospital;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC
  security:
    user:
      name: "${SECURITY_USERNAME:admin}"
      password: "${SECURITY_PASSWORD:admin123}"

smart-hospital:
  security:
    jwt:
      secret: "${JWT_SECRET:demo-cloud-jwt-secret-very-long-and-secure-hospital-key-1234567890}"
      issuer: "${JWT_ISSUER:smart-hospital-backend}"
    refresh-token:
      expiration: 604800s
      family-lifetime: 2592000s
      cleanup-retention: 2592000s
      cleanup-cron: "0 0 3 * * *"
      cleanup-batch-size: 500
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:5174"
        - "https://smart-hospital-frontend.onrender.com"
