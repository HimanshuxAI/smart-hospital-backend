spring:
  application:
    name: smart-hospital-backend
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/smart_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  security:
    user:
      name: "${SECURITY_USERNAME:local-user}"
      password: "${SECURITY_PASSWORD:local-development-password}"

server:
  port: "${SERVER_PORT:8080}"
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

smart-hospital:
  security:
    jwt:
      secret: "${JWT_SECRET:local-development-jwt-secret-change-before-production}"
      access-token-expiration: "${JWT_ACCESS_TOKEN_EXPIRATION:PT1H}"
      refresh-token-expiration: "${JWT_REFRESH_TOKEN_EXPIRATION:P7D}"
  ml:
    base-url: "${ML_SERVICE_BASE_URL:http://localhost:8000}"
    connect-timeout: "${ML_SERVICE_CONNECT_TIMEOUT:2s}"
    read-timeout: "${ML_SERVICE_READ_TIMEOUT:5s}"
