# Activate profiles explicitly:
#   Local development: SPRING_PROFILES_ACTIVE=local
#   Production:        SPRING_PROFILES_ACTIVE=prod
#                      (with DB_*, SECURITY_*, and JWT_SECRET supplied)
spring:
  application:
    name: smart-hospital-backend
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  security:
    user:
      name: "${SECURITY_USERNAME}"
      password: "${SECURITY_PASSWORD}"

server:
  port: "${SERVER_PORT:8080}"
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  seed:
    enabled: "${APP_SEED_ENABLED:false}"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

smart-hospital:
  time-zone: "${APP_TIME_ZONE:UTC}"
  security:
    jwt:
      secret: "${JWT_SECRET}"
      access-token-expiration: "${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}"
      issuer: "${JWT_ISSUER:smart-hospital-backend}"
    refresh-token:
      expiration: "${JWT_REFRESH_TOKEN_EXPIRATION:P7D}"
      family-lifetime: "${JWT_REFRESH_TOKEN_FAMILY_LIFETIME:P30D}"
      cleanup-retention: "${JWT_REFRESH_TOKEN_CLEANUP_RETENTION:P1D}"
      cleanup-cron: "${JWT_REFRESH_TOKEN_CLEANUP_CRON:0 0 * * * *}"
      cleanup-batch-size: "${JWT_REFRESH_TOKEN_CLEANUP_BATCH_SIZE:100}"
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
    rate-limit:
      window: "${AUTH_RATE_LIMIT_WINDOW:PT1M}"
      max-tracked-entries: "${AUTH_RATE_LIMIT_MAX_TRACKED_ENTRIES:10000}"
      login:
        account-limit: "${AUTH_LOGIN_ACCOUNT_RATE_LIMIT:5}"
        ip-limit: "${AUTH_LOGIN_IP_RATE_LIMIT:20}"
      registration:
        account-limit: "${AUTH_REGISTRATION_ACCOUNT_RATE_LIMIT:3}"
        ip-limit: "${AUTH_REGISTRATION_IP_RATE_LIMIT:10}"
      refresh:
        token-limit: "${AUTH_REFRESH_TOKEN_RATE_LIMIT:10}"
        ip-limit: "${AUTH_REFRESH_IP_RATE_LIMIT:30}"
  ml:
    base-url: "${ML_SERVICE_BASE_URL:http://localhost:8000}"
    connect-timeout: "${ML_SERVICE_CONNECT_TIMEOUT:2s}"
    read-timeout: "${ML_SERVICE_READ_TIMEOUT:5s}"
